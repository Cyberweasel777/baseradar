<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BaseRadar | Base Chain Intelligence</title>
  <meta name="description" content="Track trending Base coins, new launches, whale trades, and correlation intel in one dashboard.">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W0MNKBJC2E"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-W0MNKBJC2E');
    gtag('config', 'AW-18000142406');
  </script>
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --border: #1a1a2e;
      --primary: #00d4ff;
      --success: #00ff88;
      --danger: #ff4444;
      --text: #f4f7ff;
      --muted: #98a2bf;
      --shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: radial-gradient(circle at top right, rgba(0, 212, 255, 0.12), transparent 40%), var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100%;
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    .page {
      width: min(1200px, 100% - 2rem);
      margin: 0 auto;
      padding: 1.2rem 0 2rem;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.9rem;
      margin-bottom: 1rem;
    }

    .brand {
      display: grid;
      gap: 0.25rem;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .logo .accent { color: var(--primary); }

    .tagline {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .button {
      border: 1px solid var(--primary);
      background: linear-gradient(140deg, rgba(0, 212, 255, 0.18), rgba(0, 212, 255, 0.05));
      color: #e8fbff;
      border-radius: 999px;
      padding: 0.65rem 1rem;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 0 22px rgba(0, 212, 255, 0.15);
    }

    .button:hover { transform: translateY(-1px); }

    .button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .button.secondary {
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.02);
      box-shadow: none;
      color: var(--text);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.65rem;
      margin: 1rem 0 1.1rem;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      padding: 0.8rem 0.9rem;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.35rem;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 800;
      min-height: 1.5rem;
    }

    .grid {
      display: grid;
      gap: 0.9rem;
      grid-template-columns: 1fr;
    }

    .panel {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 0.95rem;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      margin-bottom: 0.85rem;
    }

    .panel h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.01em;
    }

    .muted { color: var(--muted); }

    .badge {
      font-size: 0.72rem;
      border: 1px solid rgba(0, 255, 136, 0.4);
      color: var(--success);
      border-radius: 999px;
      padding: 0.16rem 0.5rem;
      white-space: nowrap;
    }

    .badge.free {
      color: var(--primary);
      border-color: rgba(0, 212, 255, 0.3);
    }

    .table-wrap { overflow-x: auto; }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 650px;
    }

    th,
    td {
      text-align: left;
      padding: 0.58rem 0.4rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.84rem;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    tbody tr.clickable {
      cursor: pointer;
      transition: background 0.2s ease;
    }

    tbody tr.clickable:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .detail-row td {
      background: rgba(0, 212, 255, 0.04);
      border-bottom-color: rgba(0, 212, 255, 0.2);
    }

    .detail-box {
      display: grid;
      gap: 0.25rem;
      font-size: 0.82rem;
      line-height: 1.35;
      color: #d9e7f4;
      word-break: break-word;
    }

    .list-cards {
      display: grid;
      gap: 0.65rem;
    }

    .launch-card,
    .whale-row {
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 0.75rem;
      padding: 0.7rem;
      background: rgba(255, 255, 255, 0.015);
    }

    .launch-title {
      font-weight: 700;
      margin: 0 0 0.2rem;
    }

    .launch-meta,
    .whale-meta {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .whale-feed {
      display: grid;
      gap: 0.5rem;
      position: relative;
    }

    .direction {
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
    }

    .direction.buy { color: var(--success); }
    .direction.sell { color: var(--danger); }

    .blurred {
      filter: blur(3px);
      pointer-events: none;
      user-select: none;
    }

    .overlay {
      position: absolute;
      inset: auto 0 0 0;
      min-height: 58%;
      background: linear-gradient(to top, rgba(10, 10, 15, 0.94), rgba(10, 10, 15, 0.2));
      border-top: 1px solid rgba(0, 212, 255, 0.2);
      display: grid;
      place-items: center;
      padding: 0.8rem;
    }

    .overlay-content {
      text-align: center;
      display: grid;
      gap: 0.45rem;
      justify-items: center;
      max-width: 300px;
    }

    .overlay strong { color: var(--primary); }

    .heatmap {
      display: grid;
      gap: 0.32rem;
      overflow-x: auto;
      grid-template-columns: repeat(11, minmax(46px, 1fr));
      min-width: 520px;
    }

    .cell {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.4rem;
      min-height: 44px;
      display: grid;
      place-items: center;
      padding: 0.2rem;
      font-size: 0.68rem;
      text-align: center;
      color: #dce7f5;
      line-height: 1.15;
    }

    .cell.head {
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .panel-footer {
      margin-top: 0.75rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.5rem;
    }

    .notice {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .error {
      border: 1px solid rgba(255, 68, 68, 0.35);
      color: #ffd9d9;
      background: rgba(255, 68, 68, 0.08);
      border-radius: 0.7rem;
      padding: 0.65rem;
      font-size: 0.82rem;
    }

    .skeleton {
      background: linear-gradient(100deg, rgba(255, 255, 255, 0.04) 35%, rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0.04) 65%);
      background-size: 220% 100%;
      animation: shimmer 1.1s infinite;
      border-radius: 0.45rem;
    }

    .skeleton-line { height: 14px; }

    .skeleton-card {
      height: 76px;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .skeleton-grid {
      display: grid;
      gap: 0.5rem;
    }

    @keyframes shimmer {
      0% { background-position: 120% 0; }
      100% { background-position: -120% 0; }
    }

    .status-line {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.55rem;
      min-height: 1rem;
    }

    .footer {
      margin-top: 1.35rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      display: grid;
      gap: 0.65rem;
      color: var(--muted);
      font-size: 0.83rem;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    @media (min-width: 680px) {
      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 980px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .panel.wide { grid-column: span 2; }

      .page { padding-top: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand">
        <div class="logo">Base<span class="accent">Radar</span></div>
        <div class="tagline">Base Chain Intelligence</div>
      </div>
      <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
        <button class="button secondary" type="button" id="subscriptionToggle" data-cta="subscription-toggle">Switch to Pro View</button>
        <button class="button" type="button" id="getProButton" data-cta="header-get-pro">Get Pro</button>

    <section class="stats" id="statsBar" aria-live="polite">

      </div>

  </div>

  <script>
    (function () {
      const API_BASE = 'https://king-backend.fly.dev/api/botindex';
      const API_KEY = 'botindex_sk_c3c74bbd7abb4a5e77d653b42a2ef077';
      const CHECKOUT_ENDPOINT = 'https://king-backend.fly.dev/api/payments/checkout?app=baseradar&tier=pro';
      const SUCCESS_URL = 'https://baseradar.app/success';
      const CANCEL_URL = 'https://baseradar.app/landing';
      const STORAGE_SUB = 'baseradar.subscription';
      const STORAGE_API_KEY = 'baseradar.apiKey';
      const STORAGE_USER = 'baseradar.userId';

      const state = {
        isPro: false,
        trending: [],
        expandedCoin: null,
        apiKey: localStorage.getItem(STORAGE_API_KEY) || API_KEY,
        userId: localStorage.getItem(STORAGE_USER) || null
      };

      const dom = {
        statTotalCoins: document.getElementById('statTotalCoins'),
        statVolume: document.getElementById('statVolume'),
        statWallets: document.getElementById('statWallets'),
        trendingContent: document.getElementById('trendingContent'),
        trendingStatus: document.getElementById('trendingStatus'),
        trendingBadge: document.getElementById('trendingBadge'),
        newLaunchesContent: document.getElementById('newLaunchesContent'),
        newLaunchesFooter: document.getElementById('newLaunchesFooter'),
        newBadge: document.getElementById('newBadge'),
        whaleContent: document.getElementById('whaleContent'),
        whaleBadge: document.getElementById('whaleBadge'),
        correlationContent: document.getElementById('correlationContent'),
        corrBadge: document.getElementById('corrBadge'),
        getProButton: document.getElementById('getProButton'),
        subscriptionToggle: document.getElementById('subscriptionToggle')
      };

      function parseSubscription() {
        try {
          const raw = localStorage.getItem(STORAGE_SUB);
          if (!raw) return { isPro: false };
          const parsed = JSON.parse(raw);
          return { isPro: Boolean(parsed && parsed.isPro) };
        } catch (_err) {
          return { isPro: false };
        }
      }

      function saveSubscription(isPro) {
        localStorage.setItem(STORAGE_SUB, JSON.stringify({ isPro: Boolean(isPro), updatedAt: new Date().toISOString() }));
      }

      function getUserId() {
        const existing = localStorage.getItem(STORAGE_USER);
        if (existing) return existing;
        const generated = 'web-' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(STORAGE_USER, generated);
        return generated;
      }

      function getApiKey() {
        const params = new URLSearchParams(window.location.search);
        const paramKey = params.get('api_key') || params.get('apikey');
        if (paramKey) {
          localStorage.setItem(STORAGE_API_KEY, paramKey);
          return paramKey;
        }
        return localStorage.getItem(STORAGE_API_KEY) || API_KEY;
      }

      function ctaTrack(name) {
        if (typeof gtag !== 'function') return;
        gtag('event', 'cta_click', {
          event_category: 'engagement',
          event_label: name
        });
        gtag('event', 'conversion', {
          send_to: 'AW-18000142406',
          value: 9.99,
          currency: 'USD'
        });
      }

      function safeArray(payload) {
        if (Array.isArray(payload)) return payload;
        if (!payload || typeof payload !== 'object') return [];
        const candidates = ['coins', 'data', 'results', 'items', 'leaders', 'trades', 'signals'];
        for (const key of candidates) {
          if (Array.isArray(payload[key])) return payload[key];
        }
        return [];
      }

      function pickField(obj, names, fallback) {
        if (!obj || typeof obj !== 'object') return fallback;
        for (const key of names) {
          if (obj[key] !== undefined && obj[key] !== null) return obj[key];
        }
        return fallback;
      }

      function toNumber(value, fallback = 0) {
        const n = Number(value);
        return Number.isFinite(n) ? n : fallback;
      }

      function formatMoney(value) {
        const num = toNumber(value, 0);
        if (Math.abs(num) >= 1e9) return '$' + (num / 1e9).toFixed(2) + 'B';
        if (Math.abs(num) >= 1e6) return '$' + (num / 1e6).toFixed(2) + 'M';
        if (Math.abs(num) >= 1e3) return '$' + (num / 1e3).toFixed(1) + 'K';
        return '$' + num.toFixed(num >= 1 ? 2 : 6);
      }

      function formatCompact(value) {
        const num = toNumber(value, 0);
        return new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(num);
      }

      function formatPercent(value) {
        const num = toNumber(value, 0);
        const sign = num > 0 ? '+' : '';
        return sign + num.toFixed(2) + '%';
      }

      function formatDate(value) {
        if (!value) return 'Unknown';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return 'Unknown';
        return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      }

      function timeAgo(value) {
        if (!value) return 'Unknown';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return 'Unknown';
        const diffMs = Date.now() - d.getTime();
        const mins = Math.max(0, Math.floor(diffMs / 60000));
        if (mins < 60) return mins + 'm ago';
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + 'h ago';
        return Math.floor(hrs / 24) + 'd ago';
      }

      function truncateAddress(addr) {
        if (!addr || typeof addr !== 'string') return 'Unknown';
        if (addr.length < 11) return addr;
        return addr.slice(0, 6) + '...' + addr.slice(-4);
      }

      function createError(msg) {
        const div = document.createElement('div');
        div.className = 'error';
        div.textContent = msg;
        return div;
      }

      function makeSkeletonLines(count) {
        const wrap = document.createElement('div');
        wrap.className = 'skeleton-grid';
        for (let i = 0; i < count; i += 1) {
          const line = document.createElement('div');
          line.className = 'skeleton skeleton-line';
          wrap.appendChild(line);
        }
        return wrap;
      }

      function authHeaders() {
        const headers = {};
        if (state.apiKey) headers['X-API-Key'] = state.apiKey;
        if (state.userId) headers['x-external-user-id'] = state.userId;
        return headers;
      }

      async function fetchEndpoint(path) {
        const url = new URL(API_BASE + path);
        if (state.userId) {
          url.searchParams.set('user', state.userId);
        }
        const response = await fetch(url.toString(), {
          headers: authHeaders()
        });

        const payload = await response.json().catch(function () {
          return {};
        });

        if (!response.ok) {
          const message = payload && (payload.message || payload.error) ? (payload.message || payload.error) : 'Request failed';
          throw new Error(message);
        }
        if (payload && payload.error) {
          throw new Error(payload.message || payload.error);
        }
        return payload;
      }

      async function startCheckout(email) {
        dom.getProButton.disabled = true;
        dom.getProButton.textContent = 'Redirecting...';
        try {
          const body = {};
          const normalized = (email || '').trim();
          if (normalized) body.email = normalized;
          const response = await fetch(CHECKOUT_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const payload = await response.json().catch(function () {
            return {};
          });
          if (!response.ok || !payload.url) {
            throw new Error((payload && (payload.message || payload.error)) || 'Unable to create checkout session.');
          }
          window.location.href = payload.url;
        } catch (err) {
          dom.getProButton.disabled = false;
          dom.getProButton.textContent = 'Get Pro';
          dom.trendingStatus.textContent = 'Checkout error: ' + err.message + ' (success: ' + SUCCESS_URL + ', cancel: ' + CANCEL_URL + ')';
        }
      }

      function updateSubscriptionUI() {
        if (state.isPro) {
          dom.subscriptionToggle.textContent = 'Switch to Free View';
          dom.trendingBadge.textContent = 'PRO';
          dom.newBadge.textContent = 'PRO';
        } else {
          dom.subscriptionToggle.textContent = 'Switch to Pro View';
          dom.trendingBadge.textContent = 'FREE';
          dom.newBadge.textContent = 'FREE (Limited)';
        }
      }

      function renderStats(coins) {
        const list = Array.isArray(coins) ? coins : [];
        const totalCoins = list.length;
        const totalVolume = list.reduce(function (acc, coin) {
          return acc + toNumber(pickField(coin, ['volume24h', 'volume', 'volumeUsd24h'], 0));
        }, 0);
        const totalWallets = list.reduce(function (acc, coin) {
          return acc + toNumber(pickField(coin, ['uniqueHolders', 'activeWallets', 'holders'], 0));
        }, 0);

        dom.statTotalCoins.classList.remove('skeleton');
        dom.statVolume.classList.remove('skeleton');
        dom.statWallets.classList.remove('skeleton');

        dom.statTotalCoins.textContent = formatCompact(totalCoins);
        dom.statVolume.textContent = formatMoney(totalVolume);
        dom.statWallets.textContent = formatCompact(totalWallets);
      }

      function renderTrendingTable() {
        const source = state.isPro ? state.trending : state.trending.slice(0, 5);
        const table = document.createElement('table');
        table.innerHTML = [
          '<thead><tr><th>Rank</th><th>Name</th><th>Symbol</th><th>Price</th><th>24h Change</th><th>Market Cap</th><th>Volume</th></tr></thead>',
          '<tbody></tbody>'
        ].join('');

        const tbody = table.querySelector('tbody');
        source.forEach(function (coin, idx) {
          const rank = toNumber(pickField(coin, ['rank'], idx + 1), idx + 1);
          const name = pickField(coin, ['name', 'tokenName'], 'Unknown');
          const symbol = pickField(coin, ['symbol', 'ticker'], 'N/A');
          const price = toNumber(pickField(coin, ['price', 'priceUsd'], 0), 0);
          const change = toNumber(pickField(coin, ['change24h', 'priceChange24h', 'marketCapDelta24h'], 0), 0);
          const marketCap = toNumber(pickField(coin, ['marketCap', 'fdv', 'mcap'], 0), 0);
          const volume = toNumber(pickField(coin, ['volume24h', 'volume', 'volumeUsd24h'], 0), 0);
          const address = pickField(coin, ['address', 'tokenAddress', 'contractAddress'], '');

          const row = document.createElement('tr');
          row.className = 'clickable';
          row.dataset.address = address;
          row.innerHTML =
            '<td>' + rank + '</td>' +
            '<td>' + name + '</td>' +
            '<td>' + symbol + '</td>' +
            '<td>' + formatMoney(price) + '</td>' +
            '<td style="color:' + (change >= 0 ? 'var(--success)' : 'var(--danger)') + '">' + formatPercent(change) + '</td>' +
            '<td>' + formatMoney(marketCap) + '</td>' +
            '<td>' + formatMoney(volume) + '</td>';
          tbody.appendChild(row);

          if (state.expandedCoin && state.expandedCoin.address === address) {
            const detailRow = document.createElement('tr');
            detailRow.className = 'detail-row';
            detailRow.innerHTML = '<td colspan="7"><div class="detail-box" id="detail-box-' + idx + '">Loading details...</div></td>';
            tbody.appendChild(detailRow);
            renderDetailContent(detailRow.querySelector('.detail-box'), state.expandedCoin.payload || null);
          }
        });

        dom.trendingContent.innerHTML = '';
        dom.trendingContent.appendChild(table);

        if (!state.isPro && state.trending.length > 5) {
          dom.trendingStatus.textContent = 'Free view shows top 5 only. Upgrade to view all ' + state.trending.length + ' ranked coins.';
        } else {
          dom.trendingStatus.textContent = 'Auto-refresh every 60 seconds.';
        }
      }

      function renderDetailContent(container, payload) {
        if (!container) return;
        if (!payload) {
          container.textContent = 'No additional detail available for this coin.';
          return;
        }
        const coin = payload.coin || payload;
        const detailLines = [
          'Address: ' + (pickField(coin, ['address', 'tokenAddress', 'contractAddress'], 'N/A')),
          'Created: ' + formatDate(pickField(coin, ['createdAt', 'launchTime', 'created_at'], null)),
          'Total Volume: ' + formatMoney(pickField(coin, ['totalVolume', 'lifetimeVolume', 'volumeTotal'], 0)),
          'Holders: ' + formatCompact(pickField(coin, ['uniqueHolders', 'holders'], 0)),
          'Creator: ' + truncateAddress(pickField(coin, ['creatorAddress', 'creator', 'deployer'], ''))
        ];
        container.innerHTML = detailLines.map(function (line) {
          return '<div>' + line + '</div>';
        }).join('');
      }

      async function loadTrending(isInitial) {
        if (isInitial) {
          dom.trendingContent.innerHTML = '';
          dom.trendingContent.appendChild(makeSkeletonLines(8));
          dom.trendingStatus.textContent = 'Loading trending data...';
        }

        try {
          const payload = await fetchEndpoint('/zora/trending');
          const coins = safeArray(payload);
          state.trending = coins;
          renderStats(coins);
          renderTrendingTable();
        } catch (err) {
          dom.trendingContent.innerHTML = '';
          dom.trendingContent.appendChild(createError('Unable to load trending coins: ' + err.message));
          dom.trendingStatus.textContent = 'Provide API credentials via ?api_key=... if required by backend policy.';
          dom.statTotalCoins.classList.remove('skeleton');
          dom.statVolume.classList.remove('skeleton');
          dom.statWallets.classList.remove('skeleton');
          dom.statTotalCoins.textContent = '0';
          dom.statVolume.textContent = '$0.00';
          dom.statWallets.textContent = '0';
        }
      }

      async function loadCoinDetail(address, row) {
        if (!address) return;
        const existing = row.nextElementSibling;
        if (existing && existing.classList.contains('detail-row')) {
          if (state.expandedCoin && state.expandedCoin.address === address) {
            state.expandedCoin = null;
            existing.remove();
            return;
          }
          existing.remove();
        }

        state.expandedCoin = { address: address, payload: null };

        const detailRow = document.createElement('tr');
        detailRow.className = 'detail-row';
        detailRow.innerHTML = '<td colspan="7"><div class="detail-box">Loading details...</div></td>';
        row.insertAdjacentElement('afterend', detailRow);

        const detailBox = detailRow.querySelector('.detail-box');
        try {
          const payload = await fetchEndpoint('/zora/coin/' + encodeURIComponent(address));
          state.expandedCoin = { address: address, payload: payload };
          renderDetailContent(detailBox, payload);
        } catch (err) {
          detailBox.textContent = 'Unable to load detail: ' + err.message;
        }
      }

      function renderNewLaunches(list) {
        const launches = Array.isArray(list) ? list : [];
        dom.newLaunchesContent.innerHTML = '';

        if (!launches.length) {
          dom.newLaunchesContent.appendChild(createError('No launch records available right now.'));
          dom.newLaunchesFooter.innerHTML = '';
          return;
        }

        let filtered = launches;
        if (!state.isPro) {
          const threshold = Date.now() - (15 * 60 * 1000);
          const delayed = launches.filter(function (coin) {
            const created = new Date(pickField(coin, ['createdAt', 'launchTime', 'created_at'], 0)).getTime();
            return Number.isFinite(created) ? created <= threshold : true;
          });
          filtered = (delayed.length ? delayed : launches).slice(0, 3);
        }

        filtered.forEach(function (coin) {
          const card = document.createElement('article');
          card.className = 'launch-card';

          const name = pickField(coin, ['name', 'tokenName'], 'Unknown Coin');
          const symbol = pickField(coin, ['symbol', 'ticker'], 'N/A');
          const launchedAt = pickField(coin, ['createdAt', 'launchTime', 'created_at'], null);
          const creator = pickField(coin, ['creatorAddress', 'creator', 'deployer'], 'Unknown');
          const volume = pickField(coin, ['initialVolume', 'volume24h', 'volume'], 0);

          card.innerHTML =
            '<p class="launch-title">' + name + ' <span class="muted">(' + symbol + ')</span></p>' +
            '<div class="launch-meta">' +
            '<span>Launched: ' + timeAgo(launchedAt) + '</span>' +
            '<span>Initial Vol: ' + formatMoney(volume) + '</span>' +
            '<span>Creator: ' + truncateAddress(creator) + '</span>' +
            '</div>';
          dom.newLaunchesContent.appendChild(card);
        });

        dom.newLaunchesFooter.innerHTML = '';
        if (!state.isPro) {
          const cta = document.createElement('button');
          cta.className = 'button';
          cta.type = 'button';
          cta.dataset.cta = 'new-launches-unlock';
          cta.textContent = '🔒 See all launches in real-time';
          cta.addEventListener('click', function () {
            startCheckout('');
          });
          dom.newLaunchesFooter.appendChild(cta);
          const note = document.createElement('div');
          note.className = 'notice';
          note.textContent = 'Free mode is delayed by 15 minutes and limited to 3 rows.';
          dom.newLaunchesFooter.appendChild(note);
        } else {
          const note = document.createElement('div');
          note.className = 'notice';
          note.textContent = 'Pro includes real-time full history and launch alert setup.';
          dom.newLaunchesFooter.appendChild(note);
        }
      }

      async function loadNewLaunches() {
        dom.newLaunchesContent.innerHTML = '';
        for (let i = 0; i < 3; i += 1) {
          const sk = document.createElement('div');
          sk.className = 'skeleton skeleton-card';
          dom.newLaunchesContent.appendChild(sk);
        }
        dom.newLaunchesFooter.innerHTML = '';

        try {
          const payload = await fetchEndpoint('/zora/new-coins');
          renderNewLaunches(safeArray(payload));
        } catch (err) {
          dom.newLaunchesContent.innerHTML = '';
          dom.newLaunchesContent.appendChild(createError('Unable to load new launches: ' + err.message));
        }
      }

      function renderWhales(list) {
        const trades = Array.isArray(list) ? list : [];
        dom.whaleContent.innerHTML = '';

        if (!trades.length) {
          dom.whaleContent.appendChild(createError('No whale trades available right now.'));
          return;
        }

        const renderCount = state.isPro ? trades.length : Math.min(6, trades.length);
        for (let i = 0; i < renderCount; i += 1) {
          const trade = trades[i];
          const row = document.createElement('div');
          row.className = 'whale-row';
          if (!state.isPro && i >= 2) {
            row.classList.add('blurred');
          }
          const wallet = pickField(trade, ['wallet', 'walletAddress', 'address', 'trader'], 'Unknown');
          const token = pickField(trade, ['token', 'symbol', 'tokenSymbol'], 'N/A');
          const amount = pickField(trade, ['amount', 'size', 'volumeUsd'], 0);
          const sideRaw = String(pickField(trade, ['direction', 'side', 'type'], 'buy')).toLowerCase();
          const side = sideRaw.includes('sell') ? 'sell' : 'buy';
          const time = pickField(trade, ['timestamp', 'time', 'createdAt'], null);

          row.innerHTML =
            '<div class="whale-meta">' +
            '<span>' + truncateAddress(wallet) + '</span>' +
            '<span class="direction ' + side + '">' + side + '</span>' +
            '<span>' + token + '</span>' +
            '<span>' + formatMoney(amount) + '</span>' +
            '<span>' + timeAgo(time) + '</span>' +
            '</div>';
          dom.whaleContent.appendChild(row);
        }

        if (!state.isPro) {
          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          overlay.innerHTML =
            '<div class="overlay-content">' +
            '<strong>🔒 Unlock whale tracking</strong>' +
            '<div class="notice">Free view shows 2 entries. Pro unlocks full feed, filters, and export.</div>' +
            '<button type="button" class="button" data-cta="whale-unlock">Unlock Pro</button>' +
            '</div>';
          dom.whaleContent.appendChild(overlay);

          const unlockBtn = overlay.querySelector('button');
          unlockBtn.addEventListener('click', function () {
            startCheckout('');
          });
        }
      }

      async function loadWhales() {
        dom.whaleContent.innerHTML = '';
        dom.whaleContent.appendChild(makeSkeletonLines(6));
        try {
          const payload = await fetchEndpoint('/whale-trades');
          renderWhales(safeArray(payload));
        } catch (err) {
          dom.whaleContent.innerHTML = '';
          dom.whaleContent.appendChild(createError('Unable to load whale activity: ' + err.message));
        }
      }

      function sanitizeTokenLabel(value, idx) {
        const raw = value == null ? '' : String(value);
        if (!raw) return 'T' + (idx + 1);
        return raw.length > 7 ? raw.slice(0, 7) : raw;
      }

      function normalizeCorrelationPairs(payload) {
        const records = safeArray(payload);
        const out = [];

        records.forEach(function (item) {
          if (!item || typeof item !== 'object') return;
          const tokenA = pickField(item, ['tokenA', 'baseToken', 'symbolA', 'left', 'token1', 'asset1'], null);
          const tokenB = pickField(item, ['tokenB', 'quoteToken', 'symbolB', 'right', 'token2', 'asset2'], null);
          const corr = pickField(item, ['correlation', 'score', 'value', 'corr'], null);
          if (tokenA && tokenB && corr !== null) {
            out.push({
              tokenA: String(tokenA),
              tokenB: String(tokenB),
              correlation: toNumber(corr, 0)
            });
          }
        });

        if (!out.length && records.length && typeof records[0] === 'object') {
          const first = records[0];
          const keys = Object.keys(first).filter(function (k) {
            return typeof first[k] === 'number' || /^-?\d+(\.\d+)?$/.test(String(first[k]));
          });
          if (keys.length >= 3 && first.symbol) {
            records.forEach(function (row) {
              const base = row.symbol || row.token || row.name;
              keys.forEach(function (k) {
                if (k === 'symbol' || k === 'token' || k === 'name') return;
                out.push({
                  tokenA: String(base),
                  tokenB: String(k),
                  correlation: toNumber(row[k], 0)
                });
              });
            });
          }
        }

        return out;
      }

      function colorForCorrelation(value) {
        const n = Math.max(-1, Math.min(1, toNumber(value, 0)));
        if (n >= 0) {
          const alpha = 0.1 + (n * 0.55);
          return 'rgba(0, 255, 136, ' + alpha.toFixed(2) + ')';
        }
        const alpha = 0.1 + (Math.abs(n) * 0.55);
        return 'rgba(255, 68, 68, ' + alpha.toFixed(2) + ')';
      }

      function buildHeatmap(pairs) {
        const tokens = [];
        const matrix = {};

        pairs.forEach(function (pair) {
          const a = pair.tokenA;
          const b = pair.tokenB;
          if (!tokens.includes(a)) tokens.push(a);
          if (!tokens.includes(b)) tokens.push(b);

          if (!matrix[a]) matrix[a] = {};
          if (!matrix[b]) matrix[b] = {};
          matrix[a][b] = pair.correlation;
          matrix[b][a] = pair.correlation;
          matrix[a][a] = 1;
          matrix[b][b] = 1;
        });

        const top = tokens.slice(0, 10);
        const grid = document.createElement('div');
        grid.className = 'heatmap';

        const corner = document.createElement('div');
        corner.className = 'cell head';
        corner.textContent = 'Token';
        grid.appendChild(corner);

        top.forEach(function (token, idx) {
          const head = document.createElement('div');
          head.className = 'cell head';
          head.textContent = sanitizeTokenLabel(token, idx);
          grid.appendChild(head);
        });

        top.forEach(function (rowToken, rowIdx) {
          const rowHead = document.createElement('div');
          rowHead.className = 'cell head';
          rowHead.textContent = sanitizeTokenLabel(rowToken, rowIdx);
          grid.appendChild(rowHead);

          top.forEach(function (colToken) {
            const value = matrix[rowToken] && matrix[rowToken][colToken] !== undefined
              ? matrix[rowToken][colToken]
              : 0;
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.style.background = colorForCorrelation(value);
            cell.title = rowToken + ' / ' + colToken + ': ' + value.toFixed(2);
            cell.textContent = value.toFixed(2);
            grid.appendChild(cell);
          });
        });

        return { grid: grid, tokenCount: top.length };
      }

      function renderCorrelation(payload) {
        const pairs = normalizeCorrelationPairs(payload);
        dom.correlationContent.innerHTML = '';

        if (!pairs.length) {
          dom.correlationContent.appendChild(createError('No correlation pairs available right now.'));
          return;
        }

        const heatmapResult = buildHeatmap(pairs);
        const wrapper = document.createElement('div');
        wrapper.style.position = 'relative';
        wrapper.appendChild(heatmapResult.grid);

        if (!state.isPro) {
          heatmapResult.grid.classList.add('blurred');
          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          overlay.style.minHeight = '100%';
          overlay.innerHTML =
            '<div class="overlay-content">' +
            '<strong>🔒 Unlock correlation analysis</strong>' +
            '<div class="notice">Pro unlocks interactive pair drilldown and full token matrix.</div>' +
            '<button type="button" class="button" data-cta="correlation-unlock">Unlock Pro</button>' +
            '</div>';
          wrapper.appendChild(overlay);
          overlay.querySelector('button').addEventListener('click', function () {
            startCheckout('');
          });
        }

        dom.correlationContent.appendChild(wrapper);
      }

      async function loadCorrelation() {
        dom.correlationContent.innerHTML = '';
        dom.correlationContent.appendChild(makeSkeletonLines(10));

        try {
          const payload = await fetchEndpoint('/correlation-leaders');
          renderCorrelation(payload);
        } catch (err) {
          dom.correlationContent.innerHTML = '';
          dom.correlationContent.appendChild(createError('Unable to load correlation heatmap: ' + err.message));
        }
      }

      function attachCtaTracking() {
        document.addEventListener('click', function (event) {
          const target = event.target.closest('[data-cta]');
          if (!target) return;
          ctaTrack(target.getAttribute('data-cta') || 'unknown');
        });
      }

      function initInteractions() {
        dom.getProButton.addEventListener('click', function () {
          startCheckout('');
        });

        dom.subscriptionToggle.addEventListener('click', function () {
          state.isPro = !state.isPro;
          saveSubscription(state.isPro);
          updateSubscriptionUI();
          renderTrendingTable();
          loadNewLaunches();
          loadWhales();
          loadCorrelation();
        });

        dom.trendingContent.addEventListener('click', function (event) {
          const row = event.target.closest('tr.clickable');
          if (!row) return;
          const address = row.dataset.address;
          loadCoinDetail(address, row);
        });
      }

      async function initialize() {
        const sub = parseSubscription();
        state.isPro = sub.isPro;
        state.apiKey = getApiKey();
        state.userId = getUserId();

        updateSubscriptionUI();
        attachCtaTracking();
        initInteractions();

        await Promise.all([
          loadTrending(true),
          loadNewLaunches(),
          loadWhales(),
          loadCorrelation()
        ]);

        setInterval(function () {
          loadTrending(false);
        }, 60000);
      }

      initialize();
    }());
  </script>
</body>
</html>
